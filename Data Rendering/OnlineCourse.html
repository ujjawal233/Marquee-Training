let container = document.querySelector(".container");
let courseDetails = document.getElementById("courseDetails");

courses.forEach((course, index) => {

    let newDiv = document.createElement("div");

    newDiv.innerHTML = `
        <p>Course Name : ${course.course_name}</p>
        <p>Course Duration : ${course.duration}</p>
        <p>Price : ₹${course.course_price}</p>
        <p>Number of Assignments : ${course.assignments}</p>
    `;

    newDiv.classList.add("course1");
    newDiv.style.backgroundColor = colors[index % 3];

    newDiv.addEventListener("click", () => {

        let selectedCourse = courses.find(c => c.course_id === course.course_id);

        courseDetails.style.display = "block";

        courseDetails.innerHTML = `
            <h2>Course Details</h2>

            <p><b>Course ID :</b> ${selectedCourse.course_id}</p>
            <p><b>Category :</b> ${selectedCourse.category}</p>
            <p><b>Course Name :</b> ${selectedCourse.course_name}</p>
            <p><b>Duration :</b> ${selectedCourse.duration}</p>
            <p><b>Price :</b> ₹${selectedCourse.course_price}</p>
            <p><b>Assignments :</b> ${selectedCourse.assignments}</p>
            <p><b>Sections :</b> ${selectedCourse.sections}</p>
            <p><b>Topics Covered :</b> ${selectedCourse.topics_covered}</p>
            <p><b>Instructor :</b> ${selectedCourse.instructor_name}</p>
            <p><b>Level :</b> ${selectedCourse.level}</p>
            <p><b>Rating :</b> ⭐ ${selectedCourse.rating}</p>
            <p><b>Students Enrolled :</b> ${selectedCourse.students_enrolled}</p>
            <p><b>Language :</b> ${selectedCourse.language}</p>
        
            <p><b>Skills Covered :</b> ${selectedCourse.skills_covered.join(", ")}</p>

        `;

            courseDetails.style.display = "none";
        });
