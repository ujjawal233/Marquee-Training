<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .navibar{
            width: 98%;
            height: 900px;
            border: 2px solid red;
            border-radius: 20px;
            background-color: orange;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: start;
            flex-wrap: wrap;
        }
        .circle{
            border: 1px solid black;
            height: 80px;
            width: 80px;
            border-radius: 50%;
            margin: 30px;
            background-color: blue;
            text-align: center;
        }
        .inner{
            height: 80px;
            width: 140px;
            margin: 30px;
            border: 2px solid black;
            border-radius: 20px;
            background-color: bisque;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
        }
            

    </style>
</head>
<body>
    <div class="navibar">
        <div class="circle"><h1>Pic</h1></div>
        <div class="box1 inner"><h1>Hello</h1></div>
        <div class="box2 inner"></div>
        <div class="box3 inner"></div>
        <div class="box4 inner"></div>
        <div class="box5 inner"></div>
    </div>
    
</body>
</html>
