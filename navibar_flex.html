<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .navibar{
            width: 98%;
            height: 900px;
            border: 2px solid red;
            border-radius: 20px;
            background-color: orange;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: start;
            flex-wrap: wrap;
        }
        .logo{
            border: 1px solid black;
            height: 80px;
            width: 80px;
            border-radius: 50%;
            margin: 30px;
            background-color: blue;
            text-align: center;
        }
        .List{
            height: 80px;
            width: 400px;
            margin: 30px;
            border: 2px solid black;
            border-radius: 20px;
            background-color: bisque;
            display: flex;

            
        }
        ul{
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .box{
            display: flex;
            align-items: center;
        }
        .search{
            height: 60px;
            width: 140px;
            border: 2px solid black;
            border-radius:50;
        }
        .circle{
            border: 1px solid black;
            height: 80px;
            width: 80px;
            border-radius: 50%;
            margin: 30px;
            background-color: blue;
            text-align: center;
        }
            

    </style>
</head>
<body>
    <div class="navibar">
        <div class="logo"><h1>Pic</h1></div>
        <div class="List">
            <ul>
                <li><a href="https://www.flipkart.com/"></a>Home</li>
                <li><a href="https://www.flipkart.com/"></a>Content</li>
                <li><a href="https://www.flipkart.com/"></a>About us</li>
            </ul>
        </div>
        <div class="box">
        <div class="search"></div>
        <div class="circle"></div>
        </div>
        
    </div>
    
</body>
</html>
