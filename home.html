<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> For Loop</title>
</head>
<body>
    <H1> Calculator </H1>
    <Script>
        let a=10, b=12;
        function mereFunction(a,b,method){
            if(method=="addition"){
                console.log(a+b);
            }else if(method=="subtraction"){
                console.log(a-b);
            }else if(method=="multiply"){
                console.log(a*b);
            }else if(method=="Divide"){
                console.log(a/b);
            }
        }
        mereFunction(10,12,"multiply")
    </Script>
</body>
</html>
