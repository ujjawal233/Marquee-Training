<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid intro</title>
    <style>
        .container{
            height: 200px;
            width: 300px;
            /*border: 1px solid black;*/
            display: grid;
            justify-items: center;
            align-items: center;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
        }
        #A{
            height: 80px;
            width: 50px;
            background-color: blue;
            justify-self: center;
            align-self: center;
        }
        /*#B{
            height: 50px;
            width: 50px;
            background-color: blue;
            justify-self: center;
            align-self: center;

        }*/
        #C{
            height: 80px;
            width: 50px;
            background-color: blue;
            justify-self: center;
            align-self: center;
        }
        #D{
            height: 80px;
            width: 50px;
            background-color: blue;
            justify-self: center;
            align-self: center;
        }
        /*#E{
            height: 50px;
            width: 50px;
            background-color: blue;
            justify-self: right;
            align-self: right;
        }*/
        #F{
            height: 80px;
            width: 50px;
            background-color: blue;
            justify-self: center;
            align-self: center;

        }
        #G{
            height: 50px;
            width: 50px;
            background-color: blue;
            justify-self: center;
            align-self: center;

        }
        #H{
            height: 50px;
            width: 100px;
            background-color: blue;
            justify-self: center;
            align-self: center;

        }
        #I{
            height: 50px;
            width: 50px;
            background-color: blue;
            justify-self: center;
            align-self: center;
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="A"></div>
        <div id="B"></div>
        <div id="C"></div>
        <div id="D"></div>
        <div id="E"></div>
        <div id="F"></div>
        <div id="G"></div>
        <div id="H"></div>
        <div id="I"></div>


    </div>
</body>
</html>
