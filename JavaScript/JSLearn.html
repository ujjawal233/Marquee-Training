    return product.cost > max.cost ? product : max;
});

const giftResults = employees.flatMap((employee) => {
    return (employee.junior_assigned || []).map((juniorId) => {
        const junior = junior_employees.find((j) => j.employee_id === juniorId);

        if (!junior) return null;

        const cheapestGift = junior.products_in_cart.reduce((cheapest, gift) => {
            return gift.cost < cheapest.cost ? gift : cheapest;
        }, junior.products_in_cart[0]);

        return {
            "Employee Name": employee.name,
            "Junior Name": junior.name,
            "Cheapest Gift": cheapestGift.Pname,
            "Can Give Gift": employee.salary >= cheapestGift.cost
        };
    });
}).filter(Boolean);

console.log(giftResults);



employees.forEach(employee => {

    employee.junior_assigned.forEach(id => {

        junior_employees.forEach(junior => {

            if (junior.employee_id == id) {

                let minCost = junior.products_in_cart[0].cost;

                junior.products_in_cart.forEach(product => {
                    if (product.cost < minCost) {
                        minCost = product.cost;
                    }
                });

                if (employee.salary >= minCost) {
                    console.log(employee.name + " can give gift to " + junior.name);
                } else {
                    console.log(employee.name + " cannot give gift to " + junior.name);
                }
            }

        });

    });

});



let categories = [];

employees.concat(junior_employees).forEach(employee => {

    employee.interests.forEach(interest => {

        for (let key in interest) {

            if (categories.includes(key) == false) {
                categories.push(key);
            }

        }

    });

});

console.log(categories);





employees.forEach(employee => {

    let employeeTotal = 0;

    employee.interests.forEach(interest => {

        let key = Object.keys(interest)[0];
        employeeTotal += categories.indexOf(key) * 1;

    });

    console.log("Employee: " + employee.name + " -> " + employeeTotal + "%");

    employee.junior_assigned.forEach(id => {

        junior_employees.forEach(junior => {

            if (junior.employee_id == id) {

                let juniorTotal = 0;

                junior.interests.forEach(interest => {

                    let key = Object.keys(interest)[0];
                    juniorTotal += categories.indexOf(key) * 1;

                });

                console.log("   Junior: " + junior.name + " -> " + juniorTotal + "%");

            }

        });

    });

});
