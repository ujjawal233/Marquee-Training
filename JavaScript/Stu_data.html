        let shirt_shoes_owners = [];

        employees.forEach((employee) => {
            let has_shirt = false;
            let has_shoes = false;
            employee.products_in_cart.forEach((product) => {
                if (product.Pname === "Shirt") {
                    has_shirt = true;
                    total_cost_shirt_shoes += product.cost;

                if (product.Pname === "Shoes") {

        // QUESTION 5: CREATE A NEW ARRAY NAMED CONTENT_TYPES AND ADD ALL THE CONTENT TYPES OF ALL EMPLOYEES IN IT AND REMOVE THE DUPLICATES USING IF ELSE
        let content_types = [];

            employee.content_liked.forEach((content) => {
                if (!content_types.includes(content)) {
                    content_types.push(content);
                }

        // QUESTION 6: FOR ALL EMPLOYEES FIND THE PERCENTAGE OF EACH CONTENT TYPE LIKED BY EACH EMPLOYEE AND THE TOTAL SALARY USED ON EACH CONTENT TYPE USING THE INDEX AS THE PERCENTAGE NUMBER IN THE CONTENT TYPE ARRAY OF EACH CONTENT TYPE
        let content_type_percentage = [];
        employees.forEach((employee) => {
            content_types.forEach((content, index) => {
                if(employee.content_liked.includes(content)) {
                    let percentage = (index / content_types.length) * 100;
                    let value = (employee.salary * percentage) / 100;
                    content_type_percentage.push({ employee: employee.name, content: content, percentage: percentage, value: value });

        let it_department_spending = [];
        let total_it_spent = 0;
        employees.forEach((employee) => {

                let total_spent = 0;
                employee.products_in_cart.forEach((product) => {

                });
                content_types.forEach((content, index) => {

                    }
