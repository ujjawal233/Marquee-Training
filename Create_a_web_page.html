<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete HTML Form</title>
    <style>
        .container{
            width: 90%;
            max-width: 900px;
            height: 90%;
            margin: 20px;
            padding: 20px ;
            border: 20px solid black;
        
        }
        .big-rectangle {
            width: 100%;
            height: 200px;
            background: #850606;
            margin-bottom: 15px;
        }
        .small-rectangles {
            display: flex;
            gap: 15px;
        }
        .small-rectangles .small-rectangles {
            flex: 1;
            height: 120px;
            background: #de6f78;
        }
    </style>
    
</head>
<body>


    <div class="container">  
    <div class="big-rectangle"> </div>
    <div class="small-rectangles">
    <div class="small-rectangles"></div>
    <div class="small-rectangles"></div>
    </div>


    </div>
</body>
</html>
