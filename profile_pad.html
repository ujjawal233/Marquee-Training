<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile Details</title>
    <style>
        .parent{
            border: 2px solid black;
            height: 900px;
            width: 80%;
            margin: 20px;
        }
        .child1{
            border: 2px solid black;
            height: 200px;
            width: 150px;
            background-color: brown;
            padding: 2px;
            margin: 5px;
            border-radius: 50px;
        }
        .rectangle{
            border: 2px solid black;
            height: 100px;
            width: 200px;
            margin: 5px;
            border: inline;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child1"></div>
        <div class="child2"></div>
        <div class="child3"></div>
        <div class="child4"></div>
        <div class="rectangle"></div>
        <div class="rectangle"></div>
        <div class="rectangle"></div>

    </div>
</body>
</html>
