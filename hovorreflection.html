<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Container{
            height: 600px;
            width: 500px;
            border: 2px solid black;
            position: absolute;

        }
        .box:hover{
            height: 150px;
            width: 150px;
        }
        .box1:first-child{
            height: 100px;
            width: 100px;
            background-color: red;
            z-index: 4;
            top:70px;
            display: inline-block;
            margin-right: 56px;


        }
        .box2:nth-child(2){
            height: 100px;
            width: 100px;
            background-color: green;
            z-index: 3;
            bottom:70px;
            display: inline-block;
        }
        .box3:nth-child(3){
            height: 100px;
            width: 100px;
            background-color: blue;
            z-index: 2;
            display: inline-block;
        }
        .box4:last-child{
            height: 100px;
            width: 100px;
            background-color: yellow;
            z-index: 1;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="Container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
    </div>
</body>
</html>
