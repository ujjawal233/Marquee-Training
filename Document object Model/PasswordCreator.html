<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password generator</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
      background:#f5f7fb;
      margin:0;
      padding:24px;
    }
    .cont{
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #d8d8d8;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    h1{
      font-size: 20px;
      margin: 0 0 16px;
    }
    label{
      display:block;
      margin: 12px 0 6px;
      font-size: 14px;
      color:#333;
    }
    .row{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }
    input[type="text"], input[type="number"]{
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #cfcfcf;
      font-size: 14px;
    }
    .out{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top: 10px;
    }
    .out input{
      flex: 1;
    }

    button{
      height: 38px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid #cfcfcf;
      background:#111827;
      color:#fff;
      cursor:pointer;
    }
    button.secondary{
      background:#fff;
      color:#111827;
    }
    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .opts{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:10px 14px;
      margin-top: 6px;
    }
    .check{
      display:flex;
      gap:10px;
      align-items:center;
      background:#f9fafb;
      border:1px solid #e6e6e6;
      border-radius:12px;
      padding:10px;
    }
    .check input{ width:18px; height:18px; }

    .help{
      margin-top:10px;
      font-size: 13px;
      color:#6b7280;
      min-height: 18px;
    }

    @media (max-width: 520px){
      .opts{ grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="cont">
    <h1>Password Checker</h1>

    <div class="out">
      <input id="password" type="text" placeholder="Enter password here" />
      <button id="copyBtn" class="secondary" type="button">Copy</button>
    </div>
    <div class="help" id="msg" aria-live="polite"></div>

    <div class="row" style="margin-top:10px">
      <button id="checkBtn" type="button" class="secondary">Check</button>
    </div>

    <label>Password Conditions</label>
    <div class="help" id="conditions" style="border:1px dashed #e5e7eb; border-radius:12px; padding:10px;">
      Loading...
    </div>

  </div>

  <script>
    const passwordEl = document.getElementById('password');
    const msgEl = document.getElementById('msg');
    const checkBtn = document.getElementById('checkBtn');
    const copyBtn = document.getElementById('copyBtn');
    const conditionsEl = document.getElementById('conditions');

    function showMsg(text) {
      msgEl.textContent = text || '';
    }

    function hasSymbol(str) {
      return /[^A-Za-z0-9]/.test(str);
    }

    function checkPassword(pwd) {
      const lengthOk = typeof pwd === 'string' && pwd.length >= 8;
      const upperOk = typeof pwd === 'string' && /[A-Z]/.test(pwd);
      const numberOk = typeof pwd === 'string' && /[0-9]/.test(pwd);
      const symbolOk = typeof pwd === 'string' && hasSymbol(pwd);

      return {
        lengthOk,
        upperOk,
        numberOk,
        symbolOk,
        allOk: lengthOk && upperOk && numberOk && symbolOk
      };
    }

    function renderConditions(pwd) {
      const { lengthOk, upperOk, numberOk, symbolOk, allOk } = checkPassword(pwd);

      const green = '#16a34a';
      const red = '#dc2626';

      const row = (ok, text) => {
        const c = ok ? green : red;
        const icon = ok ? '✓' : '✗';
        return `<div style="margin:6px 0; color:${c}">${icon} ${text}</div>`;
      };

      conditionsEl.innerHTML = [
        row(lengthOk, 'At least 8 characters'),
        row(upperOk, 'At least 1 Uppercase (A-Z)'),
        row(numberOk, 'At least 1 number (0-9)'),
        row(symbolOk, 'At least 1 special character'),
        `<div style="margin-top:10px; font-weight:700; color:${allOk ? green : red};">${allOk ? 'Password is VALID ✅' : 'Password is NOT valid ❌'}</div>`
      ].join('');
    }

    checkBtn.addEventListener('click', () => {
      const pwd = passwordEl.value;
      if (!pwd) {
        showMsg('Enter a password to check.');
        conditionsEl.innerHTML = 'Loading...';
        return;
      }
      showMsg('');
      renderConditions(pwd);
    });

    copyBtn.addEventListener('click', async () => {
      const value = passwordEl.value;
      if (!value) {
        showMsg('Enter a password first.');
        return;
      }
      try {
        await navigator.clipboard.writeText(value);
        showMsg('Copied to clipboard.');
      } catch (e) {
        passwordEl.select();
        document.execCommand('copy');
        showMsg('Copied to clipboard.');
      }
    });
  </script>

</body>
</html>
