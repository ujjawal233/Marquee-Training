<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .root{
            --H: 20px;
            --W: 20px;
            --b: 2px solid black;
        }
        .box1{
            z-index: 6;
            height: var(--H);
            width: var(--W);
            border: var(--b);
        }
        .box2{
            z-index: 5;
            height: var(--H);
            width: var(--W);
            border: var(--b);
        }
        .box3{
            z-index: 4;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
    <div class="box6"></div>
</body>
</html>
