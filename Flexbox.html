<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        .flexContainer{
            height: 500px;
            width: 500px;
            border: 2px solid black;
            background-color: rgb(59, 232, 59);
            margin-left: 50px;
            display: flex;
            flex-direction: row;
            justify-content: start;
            align-items: center;
            flex-wrap: wrap;
        }
        .inner{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            border-radius: 20px;
            background-color: bisque;
        }

    </style>
</head>
<body>
    <div class="flexContainer">
        <div class="one inner"></div>
        <div class="two inner"></div>
        <div class="three inner"></div>
        <div class="four inner"></div>
        <div class="five inner"></div>
        <div class="six inner"></div>
        <div class="seven inner"></div>
        <div class="eight inner"></div>
        <div class="nine inner"></div>
        <div class="ten inner"></div>
        <div class="11 inner"></div>
        <div class="12 inner"></div>
        <div class="13 inner"></div>
        <div class="14 inner"></div>
        <div class="15 inner"></div>
        <div class="16 inner"></div>
        <div class="17 inner"></div>
        <div class="18 inner"></div>
        <div class="19 inner"></div>
        <div class="20 inner"></div>

    </div>
</body>
</html>
